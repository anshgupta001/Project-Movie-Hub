<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | Movie Hub</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Loader CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body class="bg-[#0b0b0f] text-white min-h-screen">


    <!-- ================= NAVBAR ================= -->

    <header class="h-[70px] px-[7%] flex items-center justify-between
               bg-[#0a0a0e] border-b border-gray-800
               sticky top-0 z-50">

        <!-- Logo -->

        <a href="index.html#home" class="flex items-center gap-2
                   text-2xl font-extrabold tracking-tight">

            <!-- Film Icon -->

            <svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-orange-500">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M7 3v18"></path>
                <path d="M17 3v18"></path>
                <path d="M3 7h4"></path>
                <path d="M3 12h4"></path>
                <path d="M3 17h4"></path>
                <path d="M17 7h4"></path>
                <path d="M17 12h4"></path>
                <path d="M17 17h4"></path>
            </svg>


            <span>
                Movie<span class="text-orange-500">Hub</span>
            </span>

        </a>



        <!-- Navigation -->

        <nav class="flex items-center gap-7 text-sm">

            <a href="index.html#home" class="text-gray-400 hover:text-orange-500
                       transition duration-300">
                Home
            </a>


            <a href="index.html#search" class="text-gray-400 hover:text-orange-500
                       transition duration-300">
                Search
            </a>


            <a href="index.html#about" class="text-gray-400 hover:text-orange-500
                       transition duration-300">
                About
            </a>


            <a href="index.html#contact" class="text-gray-400 hover:text-orange-500
                       transition duration-300">
                Contact
            </a>

        </nav>

    </header>



    <!-- ================= MOVIE DETAILS ================= -->

    <main>

        <section class="px-[7%] py-12
                   min-h-[calc(100vh-70px)]">

            <!-- Back Button -->

            <a href="index.html#search" class="inline-flex items-center gap-2
                       mb-10
                       px-4 py-2
                       bg-[#15151b]
                       border border-gray-700
                       rounded-lg
                       text-sm
                       text-gray-300
                       hover:text-white
                       hover:border-orange-500
                       transition duration-300">

                <!-- Arrow Left Icon -->

                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>

                Back to Movies

            </a>



            <!-- Movie Details -->

            <div id="movieDetails" class="max-w-6xl mx-auto">
            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="border-t border-gray-800
               bg-[#08080b]
               px-[7%] py-10
               text-center">

        <div class="flex items-center justify-center
                   gap-2
                   text-xl font-bold mb-3">

            <!-- Film Icon -->

            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-orange-500">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M7 3v18"></path>
                <path d="M17 3v18"></path>
                <path d="M3 7h4"></path>
                <path d="M3 12h4"></path>
                <path d="M3 17h4"></path>
                <path d="M17 7h4"></path>
                <path d="M17 12h4"></path>
                <path d="M17 17h4"></path>
            </svg>


            <span>
                Movie<span class="text-orange-500">Hub</span>
            </span>

        </div>


        <p class="text-gray-500 text-sm">
            Discover movies. Explore stories.
            Find your next favorite.
        </p>


        <p class="text-gray-700 text-xs mt-5">
            © 2026 Movie Hub. All rights reserved.
        </p>

    </footer>



    <!-- Movie Details JavaScript -->

    <script src="movie-details.js"></script>

</body>

</html>
